<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>captura</title>
<!-- Herramienta interna del manual: abre la app en un marco, ejecuta una receta de pasos
     y deja la vista lista para una captura de pantalla con el navegador sin ventana.
     Uso (con el servidor local de la app en el puerto 8900):
       msedge --headless=new --hide-scrollbars --window-size=1400,860 --force-device-scale-factor=2
              --virtual-time-budget=30000 --screenshot=salida.png
              "http://localhost:8900/manual/herramientas/captura.html?w=1400&h=860&do=ex:0;apply;step:3;run:distRunBtn;scroll:%23fig3Heat"
     Pasos: ex:N (carga el ejemplo N, desde 0; los dos últimos son simulados) · apply (aplica el
            preprocesamiento del Bloque 2) · step:N · run:idBoton (pulsa y espera a que el botón vuelva a
            habilitarse) · click:selector · wait:ms · scroll:selector[,desfase] · open:selector (abre un
            <details>) · select:selector=valor · set:selector=valor (un campo de texto o número, con su evento
            input) · check:selector=true|false · cfg:figura.clave=valor (opción del editor de una figura) ·
            hide:selector · frame:selector (un iframe, como la vista previa del informe, crece a la altura de su
            página) · scrollin:iframe|elemento,desfase · top · report (al final: la página se vuelve el
            informe del Bloque 8, para imprimirlo con --print-to-pdf).
     En la dirección, # se escribe %23, la coma dentro de un valor %2C y los espacios %20. -->
<style>html,body{margin:0;overflow:hidden;background:#fff}iframe{border:0;display:block;position:absolute;left:0;top:0}</style>
</head>
<body>
<iframe id="app" src="../../index.html"></iframe>
<script>
(async function () {
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('app');
  f.style.width = (p.get('w') || 1400) + 'px';
  f.style.height = (p.get('h') || 860) + 'px';
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const w = f.contentWindow, d = f.contentDocument;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const q = s => d.querySelector(decodeURIComponent(s));
  await sleep(600);
  for (const raw of (p.get('do') || '').split(';').filter(Boolean)) {
    const i = raw.indexOf(':');
    const cmd = i < 0 ? raw : raw.slice(0, i), arg = i < 0 ? '' : raw.slice(i + 1);
    if (cmd === 'ex') { w.goStep(2); await sleep(300); d.querySelectorAll('.example-btn')[+arg].click(); await sleep(2200); }
    else if (cmd === 'apply') { q('#applyBtn').click(); await sleep(1500); }
    else if (cmd === 'step') { q(`.step-btn[data-step="${arg}"]`).click(); await sleep(900); }
    /* waits while the button stays disabled (up to 20 minutes) */
    else if (cmd === 'run') { q('#' + arg).click(); await sleep(400); for (let k = 0; k < 4800 && q('#' + arg).disabled; k++) await sleep(250); await sleep(900); }
    else if (cmd === 'wait') await sleep(+arg);
    else if (cmd === 'scroll') {
      /* screenshots without a window do not follow scrolling inside a frame: the frame is
         made as tall as the page and slid up behind the visible area instead */
      const [sel, off] = arg.split(',');
      f.style.height = Math.max(+(p.get('h') || 860), d.documentElement.scrollHeight + 50) + 'px';
      await sleep(300);
      const y = q(sel).getBoundingClientRect().top + w.scrollY - (+off || 12);
      f.style.top = -Math.max(0, y) + 'px'; await sleep(500);
    }
    else if (cmd === 'click') { q(arg).click(); await sleep(700); }
    else if (cmd === 'open') { q(arg).open = true; await sleep(500); }
    else if (cmd === 'select') { const [sel, val] = arg.split('='); const n = q(sel); n.value = decodeURIComponent(val); n.dispatchEvent(new Event('change')); await sleep(600); }
    else if (cmd === 'set') { const [sel, val] = arg.split('='); const n = q(sel); n.value = decodeURIComponent(val); n.dispatchEvent(new Event('input')); n.dispatchEvent(new Event('change')); await sleep(400); }
    else if (cmd === 'check') { const [sel, val] = arg.split('='); const n = q(sel); n.checked = val !== 'false'; n.dispatchEvent(new Event('change')); await sleep(400); }
    else if (cmd === 'cfg') {
      /* cfg:figureId.key=value — an option of the figure editor, then the figure is redrawn */
      const [lhs, ...rest] = arg.split('='); const val = rest.join('=');
      const [id, key] = lhs.split('.');
      const api = w.Fig.registry[id];
      if (api) { api.cfg[key] = /^-?\d+(\.\d+)?$/.test(val) ? +val : val === 'true' ? true : val === 'false' ? false : decodeURIComponent(val); api.redraw(); }
      await sleep(500);
    }
    else if (cmd === 'hide') { d.querySelectorAll(decodeURIComponent(arg)).forEach(n => { n.style.display = 'none'; }); await sleep(300); }
    else if (cmd === 'frame') { const fr = q(arg); await sleep(600); fr.style.height = (fr.contentDocument.documentElement.scrollHeight + 24) + 'px'; await sleep(600); }
    else if (cmd === 'scrollin') {
      const [sels, off] = arg.split(','); const [frSel, inSel] = sels.split('|');
      const fr = q(frSel), target = fr.contentDocument.querySelector(decodeURIComponent(inSel));
      f.style.height = Math.max(+(p.get('h') || 860), d.documentElement.scrollHeight + 50) + 'px';
      await sleep(300);
      const y = fr.getBoundingClientRect().top + w.scrollY + target.getBoundingClientRect().top - (+off || 12);
      f.style.top = -Math.max(0, y) + 'px'; await sleep(500);
    }
    else if (cmd === 'top') { w.scrollTo(0, 0); await sleep(300); }
    else if (cmd === 'report') {
      /* report — this page becomes the report of Block 8 as built with its current options */
      const html = w.Report.build(w.B8.opts());
      document.open(); document.write(html); document.close();
      return;
    }
  }
  document.title = 'ready';
})();
</script>
</body>
</html>
